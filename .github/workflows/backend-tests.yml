name: Backend Tests

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unittest-style suites
        # Excludes the RAG/chatbot suites, which need live API keys and
        # aren't relevant to the auth/security/tracker code these test.
        run: |
          python3 -m unittest \
            tests.test_env_client_secret_separation \
            tests.test_forgot_reset_password_endpoints \
            tests.test_google_id_token_verification \
            tests.test_password_reset_token_not_logged \
            tests.test_userid_idor_fix \
            tests.test_well_known_app_links \
            -v

      - name: Run pytest-style suites
        run: pytest tests/test_password_reset.py tests/test_refresh_tokens.py -v
